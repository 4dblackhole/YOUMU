; UTF-8. Default Skin Blue — rhythmgameUI/redesign UI 시안(2026-11-12)의 부품을 뽑은 스킨.
; 그림: 1080p 기준(논리 1280×720 × 1.5), 투명 배경, 글자 없음(문구는 게임이 그림).
; 게임 화면 배치는 아직 예전 디자인이라 뜻이 같은 기존 키만 연결했습니다.
; 게임이 아직 읽지 않는 새 부품(HP 게이지 · 리플레이 표시 · 옵션 · 에디터 · Common 등)은 폴더에만 둡니다 → README.md.
; 여기 없는 키와 파일은 내장 Default Skin을 씁니다(노트 · 레인 · 판정 문구 · 키 · 히트사운드 · 숫자 그림 외 HUD 등).
; 상태 그림: 키.Hovered / 키.Pressed / 키.Disabled. 그 밖의 상태(.Selected · .Focused · .Open · .On)는 파일만 있습니다.
